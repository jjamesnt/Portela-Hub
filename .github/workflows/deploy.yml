name: Deploy to VPS (Portela Hub)

on:
  push:
    branches:
      - main
      - integracao

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              TARGET_DIR="${{ secrets.VPS_DEPLOY_PATH }}"
              BRANCH="main"
            else
              TARGET_DIR="${{ secrets.VPS_DEPLOY_PATH_INTEGRACAO }}"
              BRANCH="integracao"
            cd $TARGET_DIR
            git remote set-url origin https://github.com/$GITHUB_REPOSITORY.git
            git fetch origin
            git checkout -B $BRANCH origin/$BRANCH || git checkout -b $BRANCH
            git pull origin $BRANCH || git pull origin main
            
            # Instalar dependências (caso haja novas)
            npm install
            
            # Fazer o build de produção (para Vite/React)
            if [ "$BRANCH" = "integracao" ]; then
              npm run build -- --base=/integracao/
            else
              npm run build
            fi
            
            # Se for backend/PM2, reiniciar o serviço. Se for apenas Nginx servindo estático, o build basta.
            # pm2 restart portela-hub
            echo "Deploy concluído com sucesso na branch $BRANCH!"
